name: Sprint merge
# Branches named sprint/* are the autonomous agents' work. When CI passes on such a branch this opens a pull request
# (if none exists) and squash-merges it. When CI fails it still opens the PR so the failure is visible.
# draft/* branches are never merged automatically. See AGENTS.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write  # to read the CI run this pull request starts, and delete it when it never ran
jobs:
  merge:
    if: startsWith(github.event.workflow_run.head_branch, 'sprint/') && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RESULT: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open the pull request if needed
        # Not `|| true`: a create that fails (or leaves no pull request behind) fails this job. That is the
        # whole point — on 2026-09-09 the repository setting "Allow GitHub Actions to create and approve
        # pull requests" was off, `gh` said so, `|| true` ate it, and the job went green having merged
        # nothing, twice. See scripts/sprint_merge.py and tests/test_sprint_merge.py.
        run: python3 scripts/sprint_merge.py open-pr --branch "$BRANCH" --sha "$SHA" --result "$RESULT"
      - name: Delete the CI run this pull request could never run
        # Opening a pull request starts a CI run for a commit `push` already tested. Opened by a person it
        # skips in a second (the condition in ci.yml); opened here it cannot run at all, because GitHub will
        # not run a workflow for an event GITHUB_TOKEN created — it is filed `action_required` with zero
        # jobs, and goes red when the merge below deletes the branch. That run says nothing by existing, so
        # it goes. Only a completed, unsuccessful pull_request run for this commit *with no jobs at all* is
        # ever deleted; anything that ran stays. See scripts/sprint_merge.py and tests/test_sprint_merge.py.
        run: python3 scripts/sprint_merge.py prune-ghost-run --branch "$BRANCH" --sha "$SHA"
      - name: Merge when green, or say why not
        # One step for both outcomes, with no `if:` on it, so "did nothing" is not a state this job can
        # reach quietly: it merges, comments on a red branch, holds a `needs-human` one — or fails.
        run: python3 scripts/sprint_merge.py merge --branch "$BRANCH" --sha "$SHA" --result "$RESULT"
