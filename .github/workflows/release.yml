name: Release (macOS app)
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync
      - run: cd frontend && npm ci && npm run build
      - run: desktop/sidecar/build.sh
      - run: cd desktop/app && npm ci && ./build.sh
      - name: Package DMG
        run: |
          cd desktop/app/src-tauri/target/release/bundle/macos
          hdiutil create -volname Rapport -srcfolder Rapport.app -ov -format UDZO Rapport.dmg
      - uses: actions/upload-artifact@v4
        with: { name: Rapport.dmg, path: desktop/app/src-tauri/target/release/bundle/macos/Rapport.dmg }
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | tail -n +2 > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See CHANGELOG.md." > /tmp/notes.md
          printf '\n\nmacOS 14+, Apple silicon. Unsigned: right-click the app and choose Open the first time.\n' >> /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/app/src-tauri/target/release/bundle/macos/Rapport.dmg
          body_path: /tmp/notes.md
