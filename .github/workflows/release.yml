name: Release (macOS app)
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync
      - run: cd frontend && npm ci && npm run build
      - run: desktop/sidecar/build.sh
      - run: cd desktop/app && npm ci && ./build.sh
      - name: Package DMG
        run: |
          cd desktop/app/src-tauri/target/release/bundle/macos
          hdiutil create -volname Rapport -srcfolder Rapport.app -ov -format UDZO Rapport.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: desktop/app/src-tauri/target/release/bundle/macos/Rapport.dmg }
