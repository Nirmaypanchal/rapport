name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx tsc --noEmit && npm run build
  backend:
    runs-on: macos-14  # Apple silicon: mlx and the models are macOS-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: brew install ffmpeg
      - run: uv sync
      - run: uv run python -c "import rapport.main, rapport.sidecar, rapport.workerproc, rapport.connectors; print('ok')"
      - run: uv run python -m pytest -q tests || echo "no tests yet"
