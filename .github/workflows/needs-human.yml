name: Needs human
# Every file in sprint/needs-human/*.md is a request for the owner. This opens one issue per file (once),
# labeled needs-human and assigned to the owner, so GitHub emails them. See AGENTS.md.
# The decision of what to file lives in scripts/needs_human_issues.py, where tests/test_needs_human.py can
# reach it: the dedupe check used to be inline shell asking the issue search index, and it filed #3 and #6
# for the same request. This job only supplies the token.
on:
  push:
    branches: [main]
    paths: ["sprint/needs-human/*.md"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  escalate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/needs_human_issues.py
        env:
          GH_TOKEN: ${{ github.token }}
