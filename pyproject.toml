[project]
name = "rapport"
version = "0.1.0"
description = "Local-first AI note taker for macOS: import, transcribe, recognize speakers, summarize, search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "torch>=2.4",
    "torchaudio>=2.4",
    "pyannote.audio>=3.3",
    "silero-vad>=5.1",
    "scikit-learn>=1.5",
    "huggingface_hub>=0.24",
    "python-multipart>=0.0.32",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
]

[project.scripts]
rapport = "rapport.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rapport"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8",
    "httpx>=0.27",
]
